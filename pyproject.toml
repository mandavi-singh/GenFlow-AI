[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genflow-ai"
version = "0.1.0"
description = "Multi-agent GenAI research assistant built with LangChain, LangGraph, MCP and flows"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-ollama>=1.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.1.9",
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain-text-splitters>=1.0",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-pptx>=1.0",
    "python-multipart>=0.0.9",
    "indic-transliteration>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
genflow = "genflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff.lint]
ignore = ["BLE001"]
